<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Offline Page Extractor</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="card">
    <div class="eyebrow">MV3 TOOLKIT</div>
    <h1>Export page offline</h1>
    <p class="intro">Choose a compact visual snapshot or a DOM/CSS-preserving export.</p>
    <div class="actions">
      <button id="visualExport" class="primary">Visual Screenshot ZIP</button>
      <button id="cleanExport" class="secondary">Clean HTML/CSS ZIP</button>
    </div>
    <div id="status" class="status" role="status">Ready for the current tab.</div>
    <div class="details"><span id="assetCount">0 assets</span><span id="size">—</span></div>
    <p class="note">Visual mode reproduces the open viewport as a static design. It intentionally removes interaction and hidden page sections.</p>
  </main>
  <script src="jszip.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
